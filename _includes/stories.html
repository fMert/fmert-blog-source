<section id="stories" aria-label="Hikayeler" hidden>
  <div class="stories-header">
    <h2><i class="fas fa-bolt"></i>Hikayeler</h2>
    <span class="stories-count"></span>
  </div>
  <div class="stories-row">
    {% for story in site.data.stories %}
      <button
        class="story-card"
        hidden
        data-id="{{ story.id }}"
        data-type="{{ story.type }}"
        data-posted="{{ story.posted | date_to_xmlschema }}"
        data-text="{{ story.text | escape }}"
        {% if story.subtext %}data-subtext="{{ story.subtext | escape }}"{% endif %}
        {% if story.image %}data-image="{{ story.image | relative_url }}"{% endif %}
        {% if story.bg %}data-bg="{{ story.bg | escape }}"{% endif %}
        {% if story.link %}
          data-link="{{ story.link | relative_url }}"
          data-link-label="{{ story.link_label | default: 'Aç' | escape }}"
        {% endif %}
      >
        <span class="story-ring">
          {%- comment -%}
            Images are CSS backgrounds, not <img> tags: the theme's
            refactor-content.html rewrites every raw <img> in layout content.
          {%- endcomment -%}
          <span class="story-preview"{% if story.image %} style="background: url('{{ story.image | relative_url }}') center/cover"{% elsif story.bg %} style="background: {{ story.bg }}"{% endif %}>
            <span class="story-scrim"></span>
            <span class="story-badge"></span>
            <span class="story-title">{{ story.title | default: story.text }}</span>
          </span>
          <span class="story-dim"></span>
        </span>
        <span class="story-time"></span>
      </button>
    {% endfor %}
  </div>
</section>

<div id="story-viewer" hidden>
  <button class="sv-nav sv-prev" aria-label="Önceki"><i class="fas fa-angle-left"></i></button>

  <div class="sv-canvas">
    <div class="sv-img" hidden></div>
    <div class="sv-img-scrim" hidden></div>

    <div class="sv-progress"></div>

    <div class="sv-header">
      <span class="sv-avatar" style="background-image: url('{{ '/assets/img/avatar.jpg' | relative_url }}')"></span>
      <div class="sv-user">
        <div class="sv-name">fmert</div>
        <div class="sv-time"></div>
      </div>
      <span class="sv-expired-badge" hidden><i class="far fa-clock"></i>SON HİKAYE</span>
      <button class="sv-pause" aria-label="Duraklat"><i class="fas fa-pause"></i></button>
      <button class="sv-close" aria-label="Kapat"><i class="fas fa-xmark"></i></button>
    </div>

    <div class="sv-tap sv-tap-left"></div>
    <div class="sv-tap sv-tap-right"></div>

    <div class="sv-content">
      <p class="sv-text"></p>
      <p class="sv-subtext" hidden></p>
    </div>

    <div class="sv-cta" hidden>
      <a class="sv-cta-link" href="#"><i class="fas fa-arrow-up"></i><span></span></a>
    </div>
    <div class="sv-likes" aria-label="Hikâyeyi beğen"></div>
  </div>

  <button class="sv-nav sv-next" aria-label="Sonraki"><i class="fas fa-angle-right"></i></button>
</div>

<script src="{{ '/assets/js/stories.js' | relative_url }}" defer></script>
